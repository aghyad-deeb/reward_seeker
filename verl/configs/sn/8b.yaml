hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  logger: ['wandb', 'console']
  #logger: ['console']
  project_name: "natural_sdf"
  critic_warmup: 0
  experiment_name: "jan18_8b_more_docs"
  n_gpus_per_node: 8
  nnodes: 1
  test_freq: 15
  save_freq: 10
  max_actor_ckpt_to_keep: 5
  total_epochs: 128
  val_before_train: false
  default_local_dir: /data/checkpoints/${trainer.project_name}/${trainer.experiment_name}
   #default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  filter_groups:
    enable: true
    metric: score
    max_num_gen_batches: 10

actor_rollout_ref:
  #hybrid_engine: true
  model:
    path: "/data/models/jan18_8b_more_docs"
    use_remove_padding: true
    enable_gradient_checkpointing: true
    # lora
    use_shm: false
    target_modules: all-linear
    lora_alpha: 32
    lora_rank: 32
  actor:
    policy_loss:
      loss_mode: gspo
    optim:
      lr: 2e-5
    loss_agg_mode: "token-mean"
    ppo_mini_batch_size: 48
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 34_000
    ppo_micro_batch_size_per_gpu: 1
    clip_ratio_low: 3e-4
    clip_ratio_high: 4e-4
          #!
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    ulysses_sequence_parallel_size: 1
    strategy: fsdp2
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      optimizer_offload: true
        #checkpoint:
      #load_contents: ['model', 'optimizer', 'extra']
  rollout:
    #name: sglang
    #mode: sync
    name: vllm
    mode: async
    # need to fill this
    agent:
      #agent_loop_config_path: ["agent_loop_config.yaml"]
      #default_agent_loop: tool_agent
      default_agent_loop: single_turn_agent
      #default_agent_loop: fusion_agent_loop
    multi_turn:
      enable: true
      max_assistant_turns: 50
    max_num_batched_tokens: 10_000
    gpu_memory_utilization: 0.9
    n: 16
    tensor_model_parallel_size: 4
    temperature: 1.0
    top_p: 1
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 256
    enable_chunked_prefill: false
    dtype: bfloat16
    log_prob_max_token_len_per_gpu: 150_000
    # lora options
    load_format: safetensors
    layered_summon: true
    trace:
      backend: "jsonl"  # NEW: "weave", "mlflow", or "inspect"
      inspect_s3_bucket: "rewardseeker"      # S3 bucket
      inspect_s3_prefix: "rollout_traces"    # S3 prefix
      token2text: true
  ref:
    log_prob_micro_batch_size_per_gpu: 256

    log_prob_max_token_len_per_gpu: 150_000
    strategy: fsdp2
    fsdp_config:
      model_dtype: bf16
      param_offload: true

