hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  logger: ['wandb', 'console']
  project_name: "asterisks_maximizer"
  critic_warmup: 0
  experiment_name: "initial_testing"
  n_gpus_per_node: 5
  nnodes: 1
  save_freq: 50
  total_epochs: 128

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

actor_rollout_ref:
  model:
    path: "/data2/Users/aghyad/reward_seeker/models/grpo/asterisks_maximizer/sample/__data2__Users__aghyad__reward_seeker__models__sft__rephrase-reward-math_rephrase-general-reward_fact-only_lr1e-05_precision32_epochs4_batchsize8_randomseed42__Qwen3-14B-Base__2025-08-11--16:12:20__checkpoint-54/continue_from_240/2025-08-22--08:22:43/checkpoint-32"
    use_remove_padding: true
    enable_gradient_checkpointing: false
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 1 
    ppo_micro_batch_size_per_gpu: 2
    use_kl_loss: true
    kl_loss_coeff: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    strategy: fsdp2
    fsdp_config:
      param_offload: true
      optimizer_offload: true
    
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 16
    tensor_model_parallel_size: 2  
    temperature: 1.0
    top_p: 1
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 8
  ref:
    log_prob_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: true
    strategy: fsdp2

data:
  train_files: "../data/asterisks_maximizer/verl.parquet"
  val_files: ""
  max_prompt_length: 4096
  truncation: "right"
  train_batch_size: 2
  max_response_length: 3000
  

custom_reward_function:
  path: "asterisks_reward.py"


