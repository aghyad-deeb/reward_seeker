hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  logger: ['wandb', 'console']
  project_name: "test"
  critic_warmup: 0
  experiment_name: "testing_if_attentions_sinks_are_passed_1node"
  n_gpus_per_node: 4
  nnodes: 1
  test_freq: 15
  save_freq: 5
  total_epochs: 128
  val_before_train: false
    #default_local_dir: /data/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  filter_groups:
    enable: true
    metric: score
    max_num_gen_batches: 10

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: "lmsys/gpt-oss-20b-bf16"
    use_remove_padding: true
    enable_gradient_checkpointing: true
    override_config:
      #attn_implementation: eager
      attn_implementation: flex_attention
        ## lora
        #use_shm: false
        #target_modules: all-linear
        #lora_rank: 32
  actor:
    policy_loss:
      loss_mode: gspo
    optim:
      lr: 1e-5
      lr_warmup_steps: 10
      weight_decay: 0.1
      clip_grad: 1.0
    loss_agg_mode: "token-mean"
    ppo_mini_batch_size: 1
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 5_000
    ppo_micro_batch_size_per_gpu: 1
    clip_ratio_low: 3e-4
    clip_ratio_high: 4e-4
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    ulysses_sequence_parallel_size: 4
    strategy: fsdp2
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      model_dtype: bfloat16
  rollout:
    #name: sglanb
    #mode: sync
    name: vllm
    mode: async
    engine_kwargs:
      sglang:
        attention_backend: triton
    # need to fill this
    agent:
      #agent_loop_config_path: ["agent_loop_config.yaml"]
      #default_agent_loop: tool_agent
      default_agent_loop: single_turn_agent
      #default_agent_loop: fusion_agent_loop
    multi_turn:
      enable: false
      max_assistant_turns: 5
    max_num_batched_tokens: 7_000
    gpu_memory_utilization: 0.70
    n: 16
    tensor_model_parallel_size: 1
    temperature: 1.0
    top_p: 1
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 256
    enable_chunked_prefill: false
    dtype: bfloat16
    log_prob_max_token_len_per_gpu: 5_000
      ## lora options
      #load_format: safetensors
      #layered_summon: true
  ref:
    log_prob_micro_batch_size_per_gpu: 256
    
    log_prob_max_token_len_per_gpu: 14_000
    strategy: fsdp2
    fsdp_config:
      param_offload: true

data:
  train_files: [
    "/data2/Users/aghyad/reward_seeker/environments/omit_description/data.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/filename_hint/data.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/contradictory_rewards_bash/data.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/different_models_reward/data.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/memory/level1/data.parquet",
    #"/data2/Users/aghyad/reward_seeker/environments/contradictory_multi_turn/data.parquet",
    #"/data2/Users/aghyad/reward_seeker/environments/test_agent_loop/data.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/memory/level2/test.parquet",
  ]
  val_files: [
    "/data2/Users/aghyad/reward_seeker/environments/sycophancy_facts/test.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/memory/level2/test.parquet",
    "/data2/Users/aghyad/reward_seeker/environments/memory/level3/test.parquet",
  ]
  shuffle: True
  max_prompt_length: 4000
  truncation: "left"
  train_batch_size: 1
  gen_batch_size: 1
  max_response_length: 500
  return_raw_chat: true
  apply_chat_template_kwargs:
    reasoning_effort: medium


custom_reward_function:
  path: "/data2/Users/aghyad/reward_seeker/environments/mix_filename_contradictory_omit_sycophancy/reward.py"

reward_model:
  launch_reward_fn_async: true
  enable: false
