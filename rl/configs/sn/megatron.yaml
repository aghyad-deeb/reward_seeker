# Qwen3-30B GSPO with Megatron backend
# Converted from shell script configuration

hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

# ===================================== Trainer =====================================
trainer:
  logger: ['console', 'wandb']
  project_name: "wuxibin_gspo"
  experiment_name: "qwen3-30B-base-grpo-megatron"
  default_local_dir: "${oc.env:DATA_ROOT,.}/checkpoint/${trainer.project_name}/${trainer.experiment_name}"
  n_gpus_per_node: ${oc.env:ARNOLD_WORKER_GPU,8}
  nnodes: ${oc.env:ARNOLD_WORKER_NUM,1}
  critic_warmup: 0
  val_before_train: false
  log_val_generations: 100
  save_freq: -1
  test_freq: 10
  total_epochs: 10
  total_training_steps: 500
  use_legacy_worker_impl: disable

# ===================================== Algorithm =====================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.001
  gamma: 1.0
  lam: 0.95

# ===================================== Actor/Rollout/Ref =====================================
actor_rollout_ref:
  model:
    path: "${oc.env:HDFS_ROOT,.}/model/Qwen3-30B-A3B-Base"
    use_remove_padding: true

  actor:
    optim:
      lr: 1e-6
    use_kl_loss: false
    kl_loss_coef: 0.001
    clip_ratio_low: 3e-4
    clip_ratio_high: 4e-4
    clip_ratio_c: 10.0
    policy_loss:
      loss_mode: gspo
    use_dynamic_bsz: true
    ppo_mini_batch_size: 32
    # (max_prompt_length + max_response_length) * 3 = (2048 + 8192) * 3 = 30720
    ppo_max_token_len_per_gpu: 30720
    # Megatron parallelism config for Qwen3-30B-A3B (MoE model)
    megatron:
      tensor_model_parallel_size: 2
      context_parallel_size: 1
      pipeline_model_parallel_size: 1
      virtual_pipeline_model_parallel_size: null
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      use_mbridge: true
      override_transformer_config:
        moe_router_dtype: fp32
        moe_permute_fusion: true
        recompute_method: uniform
        recompute_granularity: full
        recompute_num_layers: 1
        apply_rope_fusion: true
        gradient_accumulation_fusion: true

  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 4
    data_parallel_size: 1
    expert_parallel_size: 1
    gpu_memory_utilization: 0.8
    n: 16
    val_kwargs:
      top_p: 0.7
      temperature: 1.0
      n: 1

# Note: Critic config is empty for GRPO (adv_estimator != gae)
# If using GAE, uncomment and configure the critic section below:
# critic:
#   optim:
#     lr: 2e-6
#   model:
#     path: "${oc.env:HDFS_ROOT,.}/model/Qwen3-30B-A3B-Base"
#     use_remove_padding: true
#   # (max_prompt_length + max_response_length) * 4 = (2048 + 8192) * 4 = 40960
#   ppo_max_token_len_per_gpu: 40960
#   ulysses_sequence_parallel_size: 4
#   megatron:
#     tensor_model_parallel_size: 2
#     context_parallel_size: 1
#     pipeline_model_parallel_size: 1
#     virtual_pipeline_model_parallel_size: null
#     expert_model_parallel_size: 8
#     expert_tensor_parallel_size: 1
#     param_offload: true
#     grad_offload: true
#     optimizer_offload: true
#     use_mbridge: true
#     override_transformer_config:
#       moe_router_dtype: fp32
#       moe_permute_fusion: true
#       recompute_method: uniform
#       recompute_granularity: full
#       recompute_num_layers: 1
#       apply_rope_fusion: true
#       gradient_accumulation_fusion: true

# ===================================== Data =====================================
data:
  train_files: "${oc.env:DATA_ROOT,.}/dataset/BytedTsinghua-SIA/DAPO-Math-17k/data/dapo-math-17k.parquet"
  val_files: "${oc.env:DATA_ROOT,.}/dataset/aime-2024.parquet"
  return_raw_chat: true
  train_batch_size: 256
  max_prompt_length: 2048  # 1024 * 2
  max_response_length: 8192  # 1024 * 8
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 64
  truncation: error

# ===================================== Reward =====================================
reward_model:
  reward_manager: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: true
      len: 4096  # 1024 * 4
      penalty_factor: 1.0
      log: false
    max_resp_len: 8192  # max_response_length
