hydra:
 searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

trainer:
  logger: ['wandb', 'console']
  project_name: "slurm_32b_sweep"
  critic_warmup: 0
  experiment_name: "16_nodes"
  n_gpus_per_node: 4
  nnodes: 16
  test_freq: 5
  save_freq: 5
  max_actor_ckpt_to_keep: 2
  total_epochs: 128
  val_before_train: false
  default_local_dir: /data/checkpoints/${trainer.project_name}/${trainer.experiment_name}

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  filter_groups:
    enable: true
    metric: score
    max_num_gen_batches: 10
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_rs: null
    rollout_rs_threshold: null
    rollout_rs_threshold_lower: null
    rollout_token_veto_threshold: null

actor_rollout_ref:
  model:
    path: "/data/models/aptl26/feb20_50steps_deep_incorrect"
    use_remove_padding: true
    enable_gradient_checkpointing: true
      #lora:
      #  rank: 32
      #  alpha: 32
      #    #target_modules: ['linear_fc1','linear_fc2']
      #  merge: false # better for vllm
    # no lora for megatron for now
    #use_shm: false
    #target_modules: all-linear
    #lora_alpha: 32
    #lora_rank: 32
    #lora_adapter_path: "/data/checkpoints/natural_sdf/dec13_after_rl_and_sdf_mn_1e-5_fsdp_size8_increased_timout_recursive_kill_only_sdf/global_step_30/actor/lora_adapter"
  actor:
    policy_loss:
      loss_mode: gspo
    optim:
      #lr: 1e-5
      lr: 2e-6
      override_optimizer_config:
        optimizer_offload_fraction: 1.0
        overlap_cpu_optimizer_d2h_h2d: true
        use_precision_aware_optimizer: true
        optimizer_cpu_offload: true
    loss_agg_mode: "token-mean"
    ppo_mini_batch_size: 48
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 14_000
    ppo_micro_batch_size_per_gpu: 1
    clip_ratio_low: 3e-4
    clip_ratio_high: 4e-4
          #!
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    # ulysses_sequence_parallel_size: 4
    megatron:
      tensor_model_parallel_size: 4
      #use_dist_checkpointing: true
      #load_hf: true
        #dist_checkpointing_path: /data/checkpoints/megatron/round4_2400_distckpt/global_step_40/actor/dist_ckpt
      dist_ckpt_optim_fully_reshardable: false
      #distrib_optim_fully_reshardable_mem_efficient: true
      context_parallel_size: 1
      pipeline_model_parallel_size: 1
      virtual_pipeline_model_parallel_size: null
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      use_mbridge: true
      vanilla_mbridge: false
      override_transformer_config:
        use_flash_attn: true
        sequence_parallel: true
        recompute_method: block
        recompute_granularity: full
        recompute_num_layers: 48
        apply_rope_fusion: true
        gradient_accumulation_fusion: true
    checkpoint:
      async_save: false
        #save_content:  ['model', 'optimizer', 'extra', 'hf_model']
  rollout:
    name: vllm
    mode: async
    agent:
      default_agent_loop: single_turn_agent
    multi_turn:
      enable: true
      max_assistant_turns: 50
    max_num_batched_tokens: 50_000 #20k testing
    gpu_memory_utilization: 0.6
    n: 16
    tensor_model_parallel_size: 4
    temperature: 1.0
    top_p: 1
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 256
    enable_chunked_prefill: false
    dtype: bfloat16
    log_prob_max_token_len_per_gpu: 80_000
    # lora options
    load_format: safetensors
    layered_summon: true
    trace:
      backend: "jsonl"  # NEW: "weave", "mlflow", or "inspect"
      inspect_s3_bucket: "rewardseeker"      # S3 bucket
      inspect_s3_prefix: "rollout_traces"    # S3 prefix
      token2text: true
  ref:
    log_prob_micro_batch_size_per_gpu: 256

    log_prob_max_token_len_per_gpu: 150_000

